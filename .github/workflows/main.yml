name: Build Klipper Firmware (ATmega1280)

on:
  workflow_dispatch: # 允许手动点击运行
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 下载 Klipper 源码
    - name: 下载 Klipper 源码
      uses: actions/checkout@v4
      with:
        repository: Klipper3d/klipper
        path: klipper
    
    # 2. 安装编译 AVR 芯片需要的工具
    - name: 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr binutils-avr avr-libc python3-dev
    
    # 3. 配置固件（关键修改：必须选 Serial 串口，不能选 USB！）
    - name: 配置固件参数
      run: |
        cd klipper
        # 写入正确的配置文件
        cat > .config << 'EOF'
        #
        # Automatically generated file; DO NOT EDIT.
        # Klipper Firmware Configuration
        #
        CONFIG_ARCH_AVR=y
        CONFIG_MACH_AVR_ATMEGA1280=y
        CONFIG_CLOCK_FREQ=16000000
        CONFIG_SERIAL=y
        CONFIG_SERIAL_BAUD=250000
        EOF
        
        # 自动填充默认配置，防止编译时卡住
        make olddefconfig
    
    # 4. 开始编译
    - name: 编译固件
      run: |
        cd klipper
        make clean
        make
    
    # 5. 上传编译好的固件（同时上传 bin 和 hex，卡刷线刷都能用）
    - name: 上传固件文件
      uses: actions/upload-artifact@v4
      with:
        name: klipper-firmware-atmega1280
        path: |
          klipper/out/klipper.bin
          klipper/out/klipper.elf.hex
        retention-days: 30
