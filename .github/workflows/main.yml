name: Build Klipper Firmware

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Klipper
      uses: actions/checkout@v3
      with:
        repository: Klipper3d/klipper
        path: klipper
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr binutils-avr avr-libc
    
    - name: Configure Firmware
      run: |
        cd klipper
        cat > .config << 'EOF'
        CONFIG_ARCH="avr"
        CONFIG_MACH="atmega1280"
        CONFIG_CLOCK_FREQ=16000000
        CONFIG_SERIAL_USB=y
        CONFIG_AVR_ATmega1280=y
        EOF
    
    - name: Build Firmware
      run: |
        cd klipper
        make clean
        make
    
    - name: Upload Firmware
      uses: actions/upload-artifact@v3
      with:
        name: klipper-firmware-atmega1280
        path: klipper/out/klipper.bin
        retention-days: 30
